<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>farm_helper — скриншоты</title>
  <meta name="description" content="Скриншоты farm_helper — учёт покупок и продаж для Majestic RP.">
  <meta property="og:title" content="farm_helper — скриншоты">
  <meta property="og:description" content="Учёт покупок и продаж для Majestic RP: окно поверх игры по F7, автоматический расчёт прибыли.">
  <meta property="og:image" content="https://aquadelin.github.io/farm_helper-releases/assets/banner.png">
  <style>
    :root {
      --bg: #0e0e0e;
      --raised: #1a1a1a;
      --border: #2e2e2e;
      --text: #f7f7f7;
      --muted: #a3a3a3;
      --accent: #e0015b;
      --accent-strong: #c0014e;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
      line-height: 1.5;
    }
    .stripe { height: 4px; background: var(--accent); }
    header, main, footer { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-top: 28px; padding-bottom: 8px; }
    .brand { display: flex; align-items: center; gap: 14px; color: inherit; text-decoration: none; }
    .brand strong { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    .brand strong span { color: var(--muted); font-weight: 700; }
    .download {
      display: inline-flex; align-items: center; height: 42px; padding: 0 20px; border-radius: 10px;
      background: var(--accent); color: #fff; font-weight: 700; text-decoration: none;
    }
    .download:hover { background: var(--accent-strong); }
    h1 { margin: 24px 0 4px; font-size: 22px; }
    .lead { margin: 0 0 24px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding-bottom: 32px; }
    .thumb {
      display: flex; flex-direction: column; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 14px;
      background: var(--raised); color: inherit; font: inherit; text-align: left; cursor: zoom-in;
      transition: border-color 120ms ease-out, transform 120ms ease-out;
    }
    .thumb:hover, .thumb:focus-visible { border-color: #4a4a4a; transform: translateY(-2px); outline: none; }
    .thumb:focus-visible { box-shadow: 0 0 0 3px rgba(224, 1, 91, 0.45); }
    .thumb .frame { display: flex; align-items: center; justify-content: center; height: 220px; border-radius: 8px; background: #111; overflow: hidden; }
    .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    .thumb b { font-size: 15px; }
    .thumb small { color: var(--muted); font-size: 13px; }
    footer { padding-bottom: 32px; color: #777; font-size: 13px; }
    footer a { color: var(--muted); }

    .viewer { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; background: rgba(8, 8, 8, 0.96); }
    .viewer.open { display: flex; }
    .viewer-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; }
    .viewer-title b { display: block; }
    .viewer-title span { color: var(--muted); font-size: 14px; }
    .counter { color: var(--muted); font-variant-numeric: tabular-nums; }
    .stage { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 0 72px 24px; }
    .stage img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); user-select: none; }
    .icon-button {
      display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border: 1px solid var(--border);
      border-radius: 50%; background: rgba(26, 26, 26, 0.9); color: var(--text); cursor: pointer;
    }
    .icon-button:hover { border-color: #5a5a5a; background: #242424; }
    .nav { position: absolute; top: 50%; transform: translateY(-50%); }
    .nav.prev { left: 14px; }
    .nav.next { right: 14px; }
    svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    @media (max-width: 640px) {
      header, main, footer { padding: 0 16px; }
      header { padding-top: 20px; }
      .grid { grid-template-columns: 1fr; }
      .stage { padding: 0 8px 16px; }
      .nav { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { .thumb { transition: none; } .thumb:hover { transform: none; } }
  </style>
</head>
<body>
  <div class="stripe"></div>
  <header>
    <a class="brand" href="https://github.com/aquadelin/farm_helper-releases">
      <svg viewBox="0 0 256 256" width="44" height="44" style="stroke:none" aria-hidden="true">
        <rect width="256" height="256" rx="56" fill="#e0015b"/>
        <rect x="56" y="150" width="40" height="50" fill="#fff"/><rect x="110" y="104" width="40" height="96" fill="#fff"/><rect x="164" y="58" width="40" height="142" fill="#fff"/>
      </svg>
      <strong>farm<span>_helper</span></strong>
    </a>
    <a class="download" href="https://github.com/aquadelin/farm_helper-releases/releases/latest">Скачать для Windows</a>
  </header>

  <main>
    <h1>Скриншоты</h1>
    <p class="lead">Учёт покупок и продаж для Majestic RP. Нажмите на скриншот, чтобы открыть его на весь экран.</p>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    Неофициальный проект. Не связан с Majestic RP и Rockstar Games. ·
    <a href="https://github.com/aquadelin/farm_helper-releases">Описание и установка</a>
  </footer>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-name">
    <div class="viewer-top">
      <div class="viewer-title"><b id="viewer-name"></b><span id="viewer-text"></span></div>
      <div style="display:flex;align-items:center;gap:14px">
        <span class="counter" id="counter"></span>
        <button class="icon-button" id="close" aria-label="Закрыть (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>
    <div class="stage" id="stage">
      <button class="icon-button nav prev" id="prev" aria-label="Предыдущий скриншот"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <img id="viewer-img" alt="">
      <button class="icon-button nav next" id="next" aria-label="Следующий скриншот"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </div>

  <script>
    // Порядок — как в меню приложения: главная, история, цены, предметы, затем панель поверх игры.
    const SHOTS = [
      { id: 'home', file: 'home.png', name: 'Главная', text: 'Прибыль за периоды, график по дням, самые прибыльные предметы' },
      { id: 'history', file: 'history.png', name: 'История', text: 'Сделки по дням, фильтры и поиск' },
      { id: 'prices', file: 'prices.png', name: 'Цены', text: 'Рейтинг предметов и график цены за штуку' },
      { id: 'items', file: 'items.png', name: 'Предметы', text: 'Каталог предметов, транспорта и одежды' },
      { id: 'card', file: 'card.png', name: 'Карточка предмета', text: 'Сведения с вики и статистика сделок' },
      { id: 'import', file: 'import.png', name: 'Импорт со скриншота', text: 'Проверка распознанных сделок перед записью' },
      { id: 'panel', file: 'panel.png', name: 'Панель поверх игры', text: 'Избранное, итог дня и последние сделки' },
      { id: 'record', file: 'panel-record.png', name: 'Запись сделки', text: 'Количество, цена и итог' },
    ];

    const grid = document.getElementById('grid');
    const viewer = document.getElementById('viewer');
    const img = document.getElementById('viewer-img');
    let current = -1;
    let opener = null;

    SHOTS.forEach((shot, i) => {
      const button = document.createElement('button');
      button.className = 'thumb';
      button.setAttribute('aria-label', `${shot.name}: открыть на весь экран`);
      const frame = document.createElement('span');
      frame.className = 'frame';
      const image = document.createElement('img');
      image.src = `assets/${shot.file}`;
      image.alt = shot.name;
      image.loading = 'lazy';
      frame.append(image);
      const name = document.createElement('b');
      name.textContent = shot.name;
      const text = document.createElement('small');
      text.textContent = shot.text;
      button.append(frame, name, text);
      button.addEventListener('click', () => open(i, button));
      grid.append(button);
    });

    function show(i) {
      current = (i + SHOTS.length) % SHOTS.length;
      const shot = SHOTS[current];
      img.src = `assets/${shot.file}`;
      img.alt = shot.name;
      document.getElementById('viewer-name').textContent = shot.name;
      document.getElementById('viewer-text').textContent = shot.text;
      document.getElementById('counter').textContent = `${current + 1} / ${SHOTS.length}`;
      history.replaceState(null, '', `#${shot.id}`);
      // Соседние кадры подгружаем заранее — листание без задержки.
      [current - 1, current + 1].forEach((n) => { new Image().src = `assets/${SHOTS[(n + SHOTS.length) % SHOTS.length].file}`; });
    }

    function open(i, from) {
      opener = from ?? null;
      viewer.classList.add('open');
      document.body.style.overflow = 'hidden';
      show(i);
      document.getElementById('close').focus();
    }

    function close() {
      viewer.classList.remove('open');
      document.body.style.overflow = '';
      history.replaceState(null, '', location.pathname);
      opener?.focus();
    }

    document.getElementById('prev').addEventListener('click', () => show(current - 1));
    document.getElementById('next').addEventListener('click', () => show(current + 1));
    document.getElementById('close').addEventListener('click', close);
    document.getElementById('stage').addEventListener('click', (e) => { if (e.target.id === 'stage') close(); });

    document.addEventListener('keydown', (e) => {
      if (!viewer.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft') show(current - 1);
      else if (e.key === 'ArrowRight') show(current + 1);
      else if (e.key === 'Tab') {
        // Фокус остаётся внутри просмотра.
        const items = [...viewer.querySelectorAll('button')].filter((b) => b.offsetParent);
        const first = items[0], last = items[items.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });

    // Свайп на телефоне.
    let touchX = null;
    viewer.addEventListener('touchstart', (e) => { touchX = e.touches[0].clientX; }, { passive: true });
    viewer.addEventListener('touchend', (e) => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
      touchX = null;
    });

    // Ссылка из README вида …/#prices открывает альбом сразу на этом скриншоте.
    const start = SHOTS.findIndex((s) => `#${s.id}` === location.hash);
    if (start >= 0) open(start);
  </script>
</body>
</html>
